# The wording of the floti.dev home page.
#
# Change any text here and rebuild; nothing else needs touching. Every entry
# is required: the build stops and names the entry if one is missing or empty.
# Text inside a demo's drawing (terminal lines, file names) lives in the demo.

# Whether Floti is released: false until the first stable release puts the
# install scripts on floti.dev. While it is false, the install page shows the
# notice at the top of install.md and every install box marks its commands as
# not live yet. Set it to true at the release; nothing else needs changing.
released: false

# The browser tab's title, and the summary search engines and link previews show.
page:
  title: Floti
  description: Be the captain of your fleet of coding agents. Every agent you run, on every machine you own, in one window.

# The bar along the top of the page.
nav:
  home: Floti, home # read out by screen readers for the logo link
  install: Install
  github: GitHub
  palette: Palette # read out by screen readers for the Gold/Sky switch
  gold: Gold
  sky: Sky

# The top of the page, above the looping Floti window: the tagline under the
# name.
hero:
  headline: Be the captain of your fleet.

# The install command box, in the hero, in the install section and at the top
# of the install guide.
install_box:
  system: Your system # read out by screen readers for the two tabs
  unix: macOS and Linux
  windows: Windows
  copy: Copy
  copied: Copied
  selected: Selected # shown when the browser will not copy, and selects the command instead
  copied_status: Install command copied.
  selected_status: Install command selected. Copy it with your keyboard.
  not_live: Not live yet # beside the tabs while released is false

# The install guide's short labels. Its headline, paragraphs and sections are
# in install.md at the root of the repository.
guide:
  label: Install guide # the small label above the guide's headline
  contents: On this page # above the links to the guide's sections

# The sections down the page, in order. Each has a small label above its
# headline, the headline itself, and the paragraph under it.
sections:
  # Composition: projects and profiles composed into one session.
  composition:
    label: Composition
    headline: Every codebase you need, in one session.
    lede: >-
      Add your projects to a workspace and one agent can work across all of
      them, with each repository's own instructions and skills.

  # The fleet: sessions that start helpers, and every machine in one window.
  fleet:
    label: The fleet
    headline: Agents that run agents. Every machine in one window.
    lede: >-
      Your agents can start helpers and hear back when they finish. Your other
      computers show up in the same window, over the SSH you already use.

  # Plugins.
  plugins:
    label: Plugins
    headline: Build your own tools into it.
    lede: >-
      A plugin is a folder you write. It can add a page, a status bar item or
      tools your agents can call.

  # Built-in tools: the browser.
  browser:
    label: Built-in tools
    headline: A browser your agents can drive.
    lede: >-
      Your agents open pages, click through them and take screenshots in a
      browser pane next to their terminal, where you can watch.

  # Persistence: sessions outlive the window.
  persistence:
    label: Persistence
    headline: Sessions outlive the window.
    lede: >-
      A small host on each machine keeps your sessions running when Floti
      closes, crashes or updates.

  # Install: the last section, with the install command again. The only place
  # the page names an agent.
  install:
    label: Install
    headline: Launch your fleet.
    lede: >-
      One command installs Floti, and it keeps itself up to date. It works with
      Claude Code today, with more agents on the way.
    guide_link: Install guide
    github_link: Floti on GitHub

# The demos: the button under each one, and what each drawing shows, read out
# by screen readers in place of the drawing.
demos:
  buttons:
    replay: Replay
    pause: Pause
    play: Play

  # Agents that run agents: the words inside the drawing a visitor reads.
  fleet:
    states: # the chip on each helper's pane
      working: working
      needs_you: needs you
      done: done
      turn_ended: turn ended
      stopped: stopped
    needs_you_count: 1 needs you # on the status bar while tester waits
    hint: Click to answer # beside tester's chip while it waits
    hint_touch: Tap to answer # the same hint on a touch screen, which has nothing to click
    answer: Answer tester # the button under the demo while tester waits
    answered_by_you: you answered # after the y in tester's terminal
    answered_by_demo: answered for you # when nobody clicked in time

  # Sessions outlive the window: the buttons under the demo and the lines on
  # the host strip that shows while the window is closed.
  persistence:
    buttons:
      close: Close Floti
      crash: Crash it
      update: Update it
      open: Open Floti
    host: Host on this PC
    closed: Floti is closed, and its sessions are still running.
    crashed: Floti crashed, but everything it started is still running.
    updating: Updating Floti
    updated: Floti updated
    away: while you were away
  descriptions:
    hero: >-
      The Floti window: a project opens from the sidebar, a session starts in it,
      another tab's status changes to needs you, the session starts two helpers that appear
      beside it as a family, and a note opens in Files.
    composition: >-
      A workspace takes three projects: harbor-api, tidewater-web and
      lantern-docs. Each joins the session with its own instructions and skills,
      and the backend profile adds shared instructions, skills and tools on top.
      The session opens in a launch folder that links all three repositories, and
      the agent adds a delivery note to the checkout form and to the API that
      saves it, editing two of the three repositories.
    fleet: >-
      One Floti window shows three machines in its sidebar: this PC, a server
      called build-box 24 milliseconds away and a laptop 41 milliseconds away,
      each with its sessions. A lead session on this PC, fix upload retry,
      starts three helpers from its terminal, also on this PC: scout, tester and
      docs. Each opens as a pane tied to the lead and appears under it in the
      sidebar, and tester starts a helper of its own, fixture-gen. Meanwhile, on
      build-box, a nightly build session starts a helper of its own, which
      finishes, and on the laptop a meal planner session ends its turn. Tester
      stops to ask whether it may raise a test timeout; you can answer it, or it
      is answered for you after a few seconds. As each helper finishes, its
      report travels back to the lead and its pane folds into a small stopped
      chip. With all three reported, the lead merges the fix.
    plugins: >-
      A task board plugin opens as a page in the sidebar. The session lists the
      open tasks through the plugin's tools, takes HB-14, Retry uploads on a 503,
      and the card moves from To do to In progress on its own.
    browser: >-
      A session opens its app's checkout page in a browser pane beside its
      terminal, types a name, an email and a card number, presses Pay, and takes a
      screenshot. The terminal lists each browser tool call, and the session
      reports that payment fails because the server rejects a card number with
      spaces.
    persistence: >-
      A Floti window with four sessions working. Buttons under it close Floti,
      crash it or update it. Each time the window goes, the host on this PC keeps
      every session running, drawn as a line of ships still counting turns while
      a clock shows the time passing. When Floti opens again it is on the same
      tabs, and each terminal marks what happened while you were away.

# The line along the bottom of the page: the ship, this line, and on the right
# the licence, linked to the LICENSE file in the floti repository.
footer:
  line: Floti is Old Norse for a fleet, said FLOH-tee.
  license: Open source, MIT License
